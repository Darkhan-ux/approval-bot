[project]
name = "approval-bot"
version = "1.0.0"
description = "Согласование заявок: Telegram-бот, Google Таблица и веб-дашборд"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
# B008: Depends(...) в аргументах — стандартный приём FastAPI
ignore = ["B008"]
